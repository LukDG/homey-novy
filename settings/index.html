<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    :root { --fg: #1d1d1f; --muted: #6e6e73; --bg: #ffffff; --panel: #f5f5f7; --line: #d2d2d7; --accent: #2a7de1; --err: #c0392b; --warn: #b7791f; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #1c1c1e; --panel: #2c2c2e; --line: #3a3a3c; --err: #ff6b5f; --warn: #f0b429; }
    }
    body { margin: 0; padding: 16px; font-family: -apple-system, system-ui, Roboto, sans-serif; color: var(--fg); background: var(--bg); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .row label { font-size: 15px; }
    .switch { position: relative; width: 46px; height: 28px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--line); border-radius: 14px; transition: .2s; cursor: pointer; }
    .slider:before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider:before { transform: translateX(18px); }
    .meter { margin: 14px 0 6px; height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; }
    .meter > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
    .tools { display: flex; gap: 8px; margin: 14px 0 8px; flex-wrap: wrap; }
    .tools input[type=search] { flex: 1 1 140px; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font-size: 14px; }
    .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 14px; cursor: pointer; }
    button.danger { color: var(--err); }
    pre { margin: 0; padding: 10px; height: 55vh; overflow: auto; background: var(--panel); border-radius: 8px; font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
    .ERROR { color: var(--err); }
    .WARN { color: var(--warn); }
    .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <h1 data-i18n="settings.title"></h1>
  <p class="sub" data-i18n="settings.intro"></p>

  <div class="row">
    <label for="enabled" data-i18n="settings.enabled"></label>
    <label class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></label>
  </div>

  <div class="meter"><div id="bar"></div></div>
  <div class="meta"><span id="size">–</span><span id="lines"></span></div>

  <div class="tools">
    <input type="search" id="filter" data-i18n-placeholder="settings.filter">
    <label class="chk"><input type="checkbox" id="onlyErrors"> <span data-i18n="settings.only_errors"></span></label>
  </div>
  <div class="tools">
    <button id="refresh" data-i18n="settings.refresh"></button>
    <button id="copy" data-i18n="settings.copy"></button>
    <button id="clear" class="danger" data-i18n="settings.clear"></button>
  </div>
  <pre id="log"></pre>
  <div class="toast" id="toast"></div>

  <script>
    function onHomeyReady(Homey) {
      const $ = (id) => document.getElementById(id);
      const t = (key, vars) => Object.entries(vars || {}).reduce((acc, [k, v]) => acc.replace(`{${k}}`, v), Homey.__(key));
      document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = Homey.__(el.getAttribute('data-i18n')); });
      document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => { el.placeholder = Homey.__(el.getAttribute('data-i18n-placeholder')); });
      if (/^ar\b/.test(Homey.getLanguage ? Homey.getLanguage() : '')) document.documentElement.dir = 'rtl';
      $('log').textContent = Homey.__('settings.loading');
      let data = { text: '', size: 0, max: 262144 };
      let timer = null;

      const toast = (msg) => {
        const t = $('toast'); t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 1800);
      };
      const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

      function visibleLines() {
        const f = $('filter').value.trim().toLowerCase();
        const onlyErr = $('onlyErrors').checked;
        return data.text.split('\n').filter((l) => l && (!f || l.toLowerCase().includes(f)) && (!onlyErr || / (ERROR|WARN) /.test(l)));
      }

      function render() {
        const pre = $('log');
        const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
        const lines = visibleLines();
        pre.innerHTML = lines.length
          ? lines.map((l) => { const m = / (ERROR|WARN) /.exec(l); return m ? `<span class="${m[1]}">${esc(l)}</span>` : esc(l); }).join('\n')
          : (data.text ? t('settings.no_match') : t('settings.empty'));
        if (atBottom) pre.scrollTop = pre.scrollHeight;
        $('bar').style.width = `${Math.min(100, (data.size / data.max) * 100).toFixed(1)}%`;
        $('size').textContent = t('settings.size', { size: (data.size / 1024).toFixed(1), max: Math.round(data.max / 1024) });
        $('lines').textContent = t('settings.lines', { n: lines.length });
      }

      function load() {
        Homey.api('GET', '/log', null, (err, result) => {
          if (err) { $('log').textContent = `${t('settings.load_failed')} ${err.message || err}`; return; }
          data = result; render();
        });
      }

      Homey.get('log_enabled', (err, value) => { $('enabled').checked = value !== false; });
      $('enabled').addEventListener('change', (e) => {
        Homey.set('log_enabled', e.target.checked, (err) => {
          if (err) { toast(t('settings.save_failed')); return; }
          toast(t(e.target.checked ? 'settings.log_on' : 'settings.log_off'));
          setTimeout(load, 300);
        });
      });
      $('filter').addEventListener('input', render);
      $('onlyErrors').addEventListener('change', render);
      $('refresh').addEventListener('click', load);
      $('clear').addEventListener('click', () => {
        const wipe = () => Homey.api('DELETE', '/log', null, (e, result) => { if (!e) { data = result; render(); toast(t('settings.cleared')); } });
        if (typeof Homey.confirm === 'function') {
          Homey.confirm(t('settings.confirm_clear'), 'warning', (err, ok) => { if (!err && ok) wipe(); });
        } else if (window.confirm(t('settings.confirm_clear'))) wipe();
      });
      $('copy').addEventListener('click', async () => {
        const text = visibleLines().join('\n');
        try {
          await navigator.clipboard.writeText(text);
        } catch (e) {
          const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
          ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        }
        toast(t('settings.copied'));
      });

      load();
      timer = setInterval(load, 5000); // live while the page is open
      window.addEventListener('pagehide', () => clearInterval(timer));
      Homey.ready();
    }
  </script>
</body>
</html>
